---
# Webサーバー構築を再現するプレイブックです。
# scripts/provision_web_server.sh と同じ対象（nginx導入、サンプルページ配置、
# ufw許可、systemd登録）を、Ansibleのモジュールで冪等に実装しています。
- name: Webサーバーを構築する（構成の再現性パック）
  hosts: web
  become: true
  roles:
    - web_server

# セキュリティ強化パック（専用ユーザー、SSH鍵認証化、sudoers drop-in、
# ufw既定拒否+許可リスト、自動更新）は、意図的に別プレイに分けています。
# 「構築」と「強化」を1つの巨大なプレイにまとめると、どちらか一方だけを
# 適用・確認したい場合（--tags や --limit での切り分け）が難しくなるためです。
- name: サーバーをセキュリティ強化する（セキュリティパック）
  hosts: web
  become: true
  roles:
    - security_hardening
