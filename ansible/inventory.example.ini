# Ansible用の在庫（インベントリ）ファイルの例です。
# 実IP・実ホスト名・秘密情報は含めません。RFC 5737で「文書化専用」と定義された
# 例示用アドレス帯（192.0.2.0/24）を使っています。実際に使う際は、検証環境の
# アドレスに書き換えたうえで、この例のようにリポジトリへコミットしないでください。
#
# 使い方:
#   cp ansible/inventory.example.ini ansible/inventory.ini
#   （実際のホスト名/IPと接続ユーザーに書き換える。ansible/inventory.ini は秘密扱いにしコミットしない）
#   ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check

[web]
web-server-example ansible_host=192.0.2.10 ansible_user=example_admin

[web:vars]
# 秘密鍵のパスやパスワードはここに書かず、ssh-agentやAnsible Vaultなど
# リポジトリ外の仕組みで管理してください。
ansible_python_interpreter=/usr/bin/python3
